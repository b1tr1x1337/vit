<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Расписание · ОГАПОУ «ВИТ»</title>
  <meta name="description" content="Расписание занятий ОГАПОУ «ВИТ»: группы, преподаватели, кабинеты, звонки">
  <meta name="theme-color" id="themeColor" content="#0D1015">
  <meta name="color-scheme" content="dark light">
  <script>
    // Тема: по умолчанию тёмная, выбор запоминается
    (function () {
      var t = "dark";
      try { if (localStorage.getItem("vit-theme") === "light") t = "light"; } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
      document.getElementById("themeColor").setAttribute("content", t === "light" ? "#EDF1F8" : "#0D1015");
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ВИТ">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%235E9FE8'/><stop offset='1' stop-color='%239D7BEA'/></linearGradient></defs><rect width='100' height='100' rx='26' fill='url(%23g)'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'>В</text></svg>">
  <!-- v=7: при обновлении app.js / style.css меняйте цифру, чтобы браузеры не брали старую версию -->
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <header class="wrap head">
    <div class="toprow">
      <button class="brand" id="brandBtn" type="button" aria-label="Моя группа — вся неделя">
        <span class="logo" aria-hidden="true">В</span><span>ОГАПОУ «ВИТ»</span>
      </button>
      <div class="tr-right">
        <div class="clock" aria-label="Текущее время">
          <span class="clock-t"><b id="clockHM">--:--</b><small id="clockS"></small></span>
          <span class="clock-d" id="clockD"></span>
        </div>
        <button class="themebtn glass" id="themeBtn" type="button" aria-label="Включить светлую тему" title="Сменить тему">
          <svg class="ic-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
          <svg class="ic-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></svg>
        </button>
      </div>
    </div>
    <div class="titlerow">
      <button class="title" id="titleBtn" type="button" aria-haspopup="dialog">
        <span class="kicker" id="kicker">Расписание</span>
        <span class="name"><span id="titleText">Загрузка…</span>
          <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </span>
      </button>
      <nav class="actions" aria-label="Меню">
        <button class="act glass" id="groupBtn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Группа</span>
        </button>
        <button class="act glass" id="searchBtn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span>Поиск</span>
        </button>
        <button class="act glass" id="bellBtn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span>Звонки</span>
        </button>
      </nav>
    </div>
  </header>

  <div class="bar" id="bar" hidden>
    <div class="wrap">
      <div class="bar-in glass">
        <div class="bar-row">
          <div class="weeknav">
            <button id="prev" class="arrow" type="button" aria-label="Предыдущая неделя"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
            <span id="weekLabel"></span>
            <button id="next" class="arrow" type="button" aria-label="Следующая неделя"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
          </div>
          <div class="seg" id="modeSeg" data-mode="week" role="tablist" aria-label="Вид">
            <span class="thumb"></span>
            <button type="button" data-mode="week" role="tab">Неделя</button>
            <button type="button" data-mode="day" role="tab">День</button>
          </div>
        </div>
        <div class="tabs" id="tabs" role="tablist" aria-label="Дни недели" hidden></div>
      </div>
    </div>
  </div>

  <main class="wrap" id="main">
    <p class="note glass" id="note" hidden></p>
    <section id="view" aria-live="polite"><p class="empty-msg">Загрузка…</p></section>
  </main>

  <footer class="wrap foot">by b1tr1x</footer>

  <div class="sheet" id="findSheet" hidden>
    <div class="sheet-bg" data-close></div>
    <div class="sheet-box sheet-find glass-strong" role="dialog" aria-modal="true" aria-labelledby="findTitle">
      <div class="sheet-head">
        <h2 id="findTitle">Поиск</h2>
        <button class="x" type="button" data-close aria-label="Закрыть"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <label class="searchbox">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Группа, преподаватель или кабинет" autocomplete="off" enterkeyhint="search">
      </label>
      <div class="chips" id="filters">
        <button type="button" data-f="all">Все</button>
        <button type="button" data-f="group">Группы</button>
        <button type="button" data-f="teacher">Преподаватели</button>
        <button type="button" data-f="room">Кабинеты</button>
      </div>
      <div class="results" id="results"></div>
    </div>
  </div>

  <div class="sheet" id="bellSheet" hidden>
    <div class="sheet-bg" data-close></div>
    <div class="sheet-box glass-strong" role="dialog" aria-modal="true" aria-labelledby="bellTitle">
      <div class="sheet-head">
        <h2 id="bellTitle">Звонки</h2>
        <button class="x" type="button" data-close aria-label="Закрыть"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <p class="sheet-sub" id="bellSub"></p>
      <div class="results" id="bellList"></div>
    </div>
  </div>

  <script>
    // Показываем понятную ошибку вместо пустой страницы
    window.__showError = function (msg) {
      var v = document.getElementById("view");
      if (v) v.innerHTML = '<div class="free glass"><b>Что-то пошло не так</b>' + msg +
        '<br><br>Обновите страницу (на ПК — Ctrl+F5). Если не помогло — проверьте, что на GitHub загружены все файлы.</div>';
    };
    window.addEventListener("error", function (e) {
      if (e && e.target && e.target.tagName === "SCRIPT") return;
      window.__showError("Ошибка: " + (e && e.message ? e.message : "неизвестная"));
    });
    // Загружаем свежие версии файлов (не из старого кэша)
    (function () {
      var v = Math.floor(Date.now() / 3e5);
      function load(src, done) {
        var s = document.createElement("script");
        s.src = src + "?v=" + v;
        s.onload = done;
        s.onerror = function () { window.__showError("Не найден файл <b>" + src + "</b>."); };
        document.body.appendChild(s);
      }
      load("groups.js", function () { load("app.js", function () {}); });
    })();
  </script>
</body>
</html>
