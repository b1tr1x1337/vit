<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Расписание · ОГАПОУ «ВИТ»</title>
  <meta name="description" content="Расписание занятий ОГАПОУ «ВИТ»: группы, преподаватели, кабинеты, звонки">
  <meta name="theme-color" content="#EEF2F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%235E9FE8'/><stop offset='1' stop-color='%23BF8EDA'/></linearGradient></defs><rect width='100' height='100' rx='26' fill='url(%23g)'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'>В</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="wrap head">
    <div class="brand">
      <span class="logo" aria-hidden="true">В</span>
      <span>ОГАПОУ «ВИТ»</span>
    </div>
    <div class="actions">
      <button class="icon glass" id="searchBtn" aria-label="Поиск по преподавателям и кабинетам">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
      <button class="icon glass" id="bellBtn" aria-label="Расписание звонков">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      </button>
    </div>
    <button class="title" id="titleBtn" aria-haspopup="dialog">
      <span class="kicker" id="kicker">Расписание</span>
      <span class="name"><span id="titleText">Выберите группу</span>
        <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </span>
    </button>
  </header>

  <div class="bar" id="bar">
    <div class="wrap bar-in glass">
      <div class="bar-row">
        <div class="weeknav" id="weekNav">
          <button id="prev" class="arrow" aria-label="Предыдущая неделя"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
          <span id="weekLabel"></span>
          <button id="next" class="arrow" aria-label="Следующая неделя"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <div class="seg" id="modeSeg" role="tablist" aria-label="Вид">
          <span class="thumb"></span>
          <button data-mode="week" role="tab">Неделя</button>
          <button data-mode="day" role="tab">День</button>
        </div>
      </div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Дни недели"></nav>
    </div>
  </div>

  <main class="wrap" id="main">
    <p class="note glass" id="note"></p>
    <section id="view" aria-live="polite"></section>
  </main>

  <footer class="wrap foot">Время московское · Нажмите на день, чтобы открыть подробно</footer>

  <!-- Поиск / выбор группы -->
  <div class="sheet" id="findSheet" hidden>
    <div class="sheet-bg" data-close></div>
    <div class="sheet-box glass-strong" role="dialog" aria-modal="true" aria-labelledby="findTitle">
      <div class="sheet-head">
        <h2 id="findTitle">Поиск</h2>
        <button class="x" data-close aria-label="Закрыть"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <label class="searchbox">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Группа, преподаватель или кабинет" autocomplete="off">
      </label>
      <div class="chips" id="filters">
        <button data-f="all">Все</button>
        <button data-f="group">Группы</button>
        <button data-f="teacher">Преподаватели</button>
        <button data-f="room">Кабинеты</button>
      </div>
      <div class="results" id="results"></div>
    </div>
  </div>

  <!-- Звонки -->
  <div class="sheet" id="bellSheet" hidden>
    <div class="sheet-bg" data-close></div>
    <div class="sheet-box glass-strong" role="dialog" aria-modal="true" aria-labelledby="bellTitle">
      <div class="sheet-head">
        <h2 id="bellTitle">Звонки</h2>
        <button class="x" data-close aria-label="Закрыть"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <p class="sheet-sub" id="bellSub"></p>
      <div class="results" id="bellList"></div>
    </div>
  </div>

  <script src="groups.js"></script>
  <script src="app.js"></script>
</body>
</html>
